name: MediaForge CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Typecheck, Architecture Validation, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Cache pnpm Store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Workspace Dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Monorepo Typecheck
        run: corepack pnpm -r run typecheck

      - name: Architecture Boundary Validation
        run: node scripts/check-architecture.cjs

      - name: Execute Workspace Unit & Integration Tests
        run: corepack pnpm -r run test

      - name: Monorepo Production Build
        run: corepack pnpm -r run build
